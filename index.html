<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Engine · Noxe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito:wght@800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EDEFF2; --ink:#141823; --graphite:#69707F; --violet:#6E2BF0; --lavender:#B08CFF; }
  html, body { margin:0; height:100%; background:#0b0d14; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; container-type:size; overflow:hidden; isolation:isolate; background:#000;
           box-shadow:0 0 0 1px #1c2030, 0 20px 60px rgba(0,0,0,.5); flex:none; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none; }

  /* on-stage control bar */
  #hud { position:absolute; left:50%; bottom:4cqmin; transform:translateX(-50%); display:flex; align-items:center; gap:1.4em;
         padding:.75em 1em; border-radius:1.1em; background:rgba(20,24,35,.74); border:1px solid rgba(237,239,242,.1);
         backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
         box-shadow:0 .6em 2.4em rgba(5,7,14,.35); font-size:clamp(9px, 1.9cqmin, 16px); color:var(--paper);
         user-select:none; white-space:nowrap; }
  #hud .group { display:flex; align-items:center; gap:.9em; }
  #hud .meta { min-width:4.6em; }
  #hud .label { font:500 .66em/1 'IBM Plex Mono', monospace; letter-spacing:.14em; text-transform:uppercase; color:#8d94a4; }
  #hud .value { font:600 1.02em/1.25 'Outfit', sans-serif; margin-top:.3em; }
  #hud .btns, #hud .tools { display:flex; gap:.3em; }
  #hud .tools { padding-left:1.2em; border-left:1px solid rgba(237,239,242,.12); }
  #hud button { width:2.35em; height:2.35em; display:grid; place-items:center; padding:0; border:0; border-radius:.65em;
                background:transparent; color:rgba(237,239,242,.62); cursor:pointer; transition:background .18s, color .18s, transform .12s; }
  #hud button:hover { background:rgba(237,239,242,.08); color:var(--paper); }
  #hud button:active { transform:scale(.92); }
  #hud button.on { background:var(--violet); color:#fff; box-shadow:0 0 0 1px rgba(176,140,255,.45) inset; }
  #hud button svg { width:1.15em; height:1.15em; display:block; }

  /* pixel cursor for panel recordings */
  #cursor { position:absolute; left:0; top:0; width:clamp(12px, 2.6cqmin, 26px); pointer-events:none; display:none; z-index:5;
            margin:-1px 0 0 -1px; transition:scale .08s; transform-origin:0 0; }
  #cursor svg { display:block; width:100%; height:auto; image-rendering:pixelated; }
  #cursor.down svg { scale:.86; transform-origin:0 0; }
  #stage.pixel-cursor, #stage.pixel-cursor * { cursor:none !important; }
  #stage.pixel-cursor #cursor { display:block; }

  #toast { position:fixed; left:20px; bottom:18px; opacity:0; transform:translateY(8px); transition:.25s; z-index:20;
           background:var(--ink); color:var(--paper); border:1px solid #2a3042; border-radius:8px; padding:8px 14px;
           font:400 12px 'Outfit', sans-serif; pointer-events:none; max-width:60vw; }
  #toast.on { opacity:1; transform:none; }
  #rec { position:fixed; left:20px; top:16px; display:none; align-items:center; gap:8px; z-index:20;
         font:500 11px 'IBM Plex Mono', monospace; color:var(--paper); letter-spacing:.08em; }
  #rec::before { content:''; width:9px; height:9px; border-radius:50%; background:#ff3b5c; animation:blink 1s infinite; }
  #rec.on { display:flex; }
  @keyframes blink { 50% { opacity:.25; } }
  #brand { position:fixed; left:20px; top:16px; font:500 11px 'IBM Plex Mono', monospace; color:#5d6475; letter-spacing:.1em; }
  #brand b { font:800 13px 'Nunito', sans-serif; color:var(--lavender); letter-spacing:.06em; margin-right:8px; }
  #rec.on ~ #brand { display:none; }
  body.recording .lil-gui.root { display:none; }

  .lil-gui { --background-color:#141823; --text-color:#EDEFF2; --title-background-color:#0d1018; --title-text-color:#EDEFF2;
             --widget-color:#232838; --hover-color:#2c3245; --focus-color:#3a2a6e; --number-color:#B08CFF; --string-color:#B08CFF;
             --font-family:'IBM Plex Mono', monospace; --font-size:11px; --input-font-size:11px; --widget-height:20px;
             --name-width:44%; --folder-indent:6px; }
  .lil-gui.root { border-radius:10px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.45); top:12px !important; right:12px !important; width:276px; }
  .lil-gui.root > .title { font-family:'Nunito', sans-serif; font-weight:800; font-size:13px; letter-spacing:.03em; }
  .lil-gui .title { font-weight:600; }
  .lil-gui.root > .children { max-height:calc(100vh - 70px); overflow-y:auto; }
  /* phones: the folded panel stays clear of the brand label */
  @media (max-width: 899px) { .lil-gui.root.closed { width:150px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
} }
</script>
</head>
<body>
<div id="rec"><span>0.0s</span></div>
<div id="brand"><b>NOXE</b>PIXEL ENGINE</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="cursor"></div>
</div>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
